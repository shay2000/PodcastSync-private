name: Build and publish Docker release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update
        required: true
        type: string
      source_ref:
        description: Git ref to build; defaults to the ref used to start this workflow
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Must match the image referenced by docker-compose.yml and deploy/linux/install.sh.
  IMAGE_NAME: shay2000/podcastsync

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag)) || github.ref }}
          fetch-depth: 0

      - name: Check version consistency
        run: ./scripts/check_version.sh "$RELEASE_TAG"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend tests && ruff format --check backend tests

      - name: Run characterization tests
        run: python -m pytest tests/ -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On a tag push, derive semver tags (X.Y.Z, X.Y) plus latest. On a
          # manual dispatch, github.ref is a branch, so semver matching yields
          # nothing — fall back to the explicit release_tag input.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG#v}"
          docker pull "$IMAGE"
          docker run -d --name podcastsync-smoke \
            -e PODCASTSYNC_DB=/data/podcastsync.db \
            -e PODCASTSYNC_STORAGE=/data/PodcastMirror \
            -e PODCASTSYNC_PORT=8642 \
            -e YOUTUBE_API_KEY= \
            -p 127.0.0.1:8643:8642 \
            "$IMAGE"
          trap 'docker rm -f podcastsync-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8643/api/status" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl -fsS "http://127.0.0.1:8643/api/status"
          curl -fsS "http://127.0.0.1:8643/" | grep -q "PodcastSync"

      - name: Stage release assets
        run: |
          mkdir -p release/deploy/caddy
          cp docker-compose.yml docker-compose.cookies.yml .env.example release/
          cp deploy/caddy/Caddyfile.docker release/deploy/caddy/
          cp deploy/linux/install.sh release/
          chmod +x release/install.sh
          tar -czf "podcastsync-docker-${RELEASE_TAG#v}.tar.gz" -C release .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PodcastSync-${{ env.RELEASE_TAG }}
          path: |
            release/install.sh
            podcastsync-docker-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Ensure target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "PodcastSync $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/install.sh \
            "podcastsync-docker-${RELEASE_TAG#v}.tar.gz" \
            --clobber
