name: Build and publish macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to update
        required: true
        type: string
      source_ref:
        description: Git ref to build; defaults to the ref used to start this workflow
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    # macos-14 is the hosted arm64 runner, matching the native macOS app and
    # the arm64 PyInstaller bundle produced by the checked-in build scripts.
    runs-on: macos-14

    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag)) || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -e ".[dev]"

      - name: Check version consistency
        run: ./scripts/check_version.sh "$RELEASE_TAG"

      - name: Install media tools
        run: |
          if ! brew list --versions ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run characterization tests
        run: venv/bin/python -m pytest tests/ -q

      - name: Verify macOS packaging tools
        run: |
          for tool in swift hdiutil SetFile Rez DeRez tiffutil tiff2icns; do
            command -v "$tool"
          done

      - name: Set bundle version
        run: echo "PODCASTSYNC_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build app and DMG
        run: ./scripts/build_app.sh

      - name: Smoke test packaged backend
        env:
          PODCASTSYNC_DB: /tmp/podcastsync-smoke/podcastsync.db
          PODCASTSYNC_STORAGE: /tmp/podcastsync-smoke/storage
          PODCASTSYNC_PORT: "8643"
          YOUTUBE_API_KEY: ""
        run: |
          set -euo pipefail
          mkdir -p "$PODCASTSYNC_STORAGE"
          build/backend-dist/podcastsync-backend/podcastsync-backend &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PODCASTSYNC_PORT}/api/status" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl -fsS "http://127.0.0.1:${PODCASTSYNC_PORT}/api/status"
          curl -fsS "http://127.0.0.1:${PODCASTSYNC_PORT}/" | grep -q "PodcastSync"
          curl -fsS "http://127.0.0.1:${PODCASTSYNC_PORT}/app-icon.svg" -o /dev/null

      - name: Verify DMG
        run: |
          test -s build/PodcastSync.dmg
          hdiutil imageinfo build/PodcastSync.dmg >/dev/null
          shasum -a 256 build/PodcastSync.dmg | tee build/PodcastSync.dmg.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: PodcastSync-${{ env.RELEASE_TAG }}
          path: |
            build/PodcastSync.dmg
            build/PodcastSync.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Ensure target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "PodcastSync $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Replace release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/PodcastSync.dmg build/PodcastSync.dmg.sha256 --clobber
