# PodcastSync — safe-by-default Docker Compose.
#
# The backend is published ONLY on the host loopback interface
# (127.0.0.1:8642), which makes it reachable through an SSH tunnel for the
# administrator. The optional `public` profile adds a Caddy container that
# publishes only HTTPS podcast feeds and audio; the dashboard and /api remain
# private. Never publish 8642 to 0.0.0.0.
#
# PODCASTSYNC_PUBLIC_URL is required. YOUTUBE_API_KEY and
# PODCASTSYNC_POLL_INTERVAL are optional and are read from the host environment
# or a local .env file, so no secret is embedded here.
services:
  podcastsync:
    build: .
    container_name: podcastsync
    restart: unless-stopped
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - PODCASTSYNC_PUBLIC_URL=${PODCASTSYNC_PUBLIC_URL:?set to https://your.domain}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - PODCASTSYNC_POLL_INTERVAL=${PODCASTSYNC_POLL_INTERVAL:-30}
    volumes:
      - podcastsync-data:/data

  # Run with: docker compose --profile public up -d --build
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    container_name: podcastsync-caddy
    restart: unless-stopped
    environment:
      - PODCASTSYNC_DOMAIN=${PODCASTSYNC_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      podcastsync:
        condition: service_healthy

volumes:
  # Persistent SQLite database + PodcastMirror audio library.
  podcastsync-data:
  # Caddy's certificates and configuration must survive container updates.
  caddy-data:
  caddy-config:
